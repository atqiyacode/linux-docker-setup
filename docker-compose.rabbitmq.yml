version: '3.8'

services:
  # rabbitmq
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-3-management}
    container_name: ${RABBITMQ_NAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - ${RABBITMQ_FORWARD_PORT:-5672}:5672    # AMQP default port
      - ${RABBITMQ_UI_FORWARD_PORT:-15672}:15672  # Management UI port
    volumes:
      - ${RABBITMQ_DATA_VOLUME:-rabbitmq_data}:/var/lib/rabbitmq  # Persistent volume untuk menyimpan data RabbitMQ


volumes:
  grafana-data:
  prometheus-data: